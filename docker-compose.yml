services:
  # ----------------------------------------------------------------------------
  # Base de données PostgreSQL
  # ----------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: aviadb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aviadb
      POSTGRES_USER: aviadb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # Collation neutre et performances stables quelle que soit la machine
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # Volume nommé (et non un dossier de l'hôte) : PostgreSQL impose ses
      # propres permissions sur son répertoire de données.
      - aviadb-pgdata:/var/lib/postgresql
    ports:
      # 5434 côté hôte : 5432 est déjà pris par le PostgreSQL du système et
      # 5433 par un autre projet. Le backend, lui, joint la base en interne
      # sur « db:5432 ».
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviadb -d aviadb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    image: aviadb-backend:latest
    container_name: aviadb-backend
    restart: unless-stopped
    environment:
      # Base PostgreSQL du service « db ».
      DATABASE_URL: postgresql+psycopg://aviadb:${POSTGRES_PASSWORD:-change-me}@db:5432/aviadb
      # Images uniquement : la base vit désormais dans le volume PostgreSQL.
      UPLOAD_DIR: /app/data/uploads
      IMAGE_MAX_DIMENSION: "1600"
      # Mot de passe du premier compte admin. Surchargez-le via un fichier .env.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_TOKEN_TTL: "43200"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    image: aviadb-frontend:latest
    container_name: aviadb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"

  # ----------------------------------------------------------------------------
  # Sauvegardes ZIP automatiques (planifiées), avec rétention.
  # ----------------------------------------------------------------------------
  backup:
    build: ./backend
    image: aviadb-backend:latest
    container_name: aviadb-backup
    restart: unless-stopped
    command: ["python", "-m", "app.backup_scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://aviadb:${POSTGRES_PASSWORD:-change-me}@db:5432/aviadb
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: "7"
      BACKUP_INTERVAL: "86400"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  aviadb-pgdata:
