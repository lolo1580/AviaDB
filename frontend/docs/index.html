<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API AviaDB — documentation</title>
    <script>
      /* Le thème suit celui choisi dans l'application (même clé de stockage). */
      (function () {
        try {
          var stored = localStorage.getItem('aviadb-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f8fafc;
        --bar-bg: #ffffff;
        --bar-border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
      }
      html.dark {
        color-scheme: dark;
        --page-bg: #0b1120;
        --bar-bg: #0f172a;
        --bar-border: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1.25rem;
        background: var(--bar-bg);
        border-bottom: 1px solid var(--bar-border);
      }
      .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; }
      .logo {
        display: grid; place-items: center;
        width: 2rem; height: 2rem; border-radius: 0.65rem;
        background: #0284c7; color: #fff; font-size: 0.9rem;
      }
      .bar .sub { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
      .bar nav { margin-left: auto; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .bar a.link {
        padding: 0.4rem 0.75rem;
        border: 1px solid var(--bar-border);
        border-radius: 0.5rem;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.8rem;
      }
      .bar a.link:hover { color: var(--text); }
      #message {
        max-width: 34rem;
        margin: 4rem auto;
        padding: 1.5rem;
        border: 1px solid var(--bar-border);
        border-radius: 0.75rem;
        background: var(--bar-bg);
        text-align: center;
      }
      #message h1 { margin: 0 0 0.5rem; font-size: 1.1rem; }
      #message p { margin: 0 0 1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
      #message a {
        display: inline-block; padding: 0.5rem 1rem; border-radius: 0.5rem;
        background: var(--accent); color: #fff; text-decoration: none; font-size: 0.85rem;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <header class="bar">
      <span class="brand">
        <span class="logo">A</span>
        <span>
          API AviaDB
          <span class="sub">— documentation générée depuis le schéma OpenAPI</span>
        </span>
      </span>
      <nav>
        <a class="link" href="/">← Retour à l’application</a>
        <a class="link" href="/openapi.json" download="aviadb-openapi.json">Télécharger le schéma</a>
      </nav>
    </header>

    <main id="redoc"></main>

    <section id="message" class="hidden">
      <h1 id="message-title">Documentation indisponible</h1>
      <p id="message-text"></p>
      <a id="message-action" href="/">Ouvrir l’application</a>
    </section>

    <script src="redoc.standalone.js"></script>
    <script>
      const dark = document.documentElement.classList.contains('dark')

      const lightTheme = {
        colors: { primary: { main: '#0284c7' } },
        typography: { fontSize: '15px' },
      }

      const darkTheme = {
        colors: {
          primary: { main: '#38bdf8' },
          success: { main: '#4ade80' },
          warning: { main: '#fbbf24' },
          error: { main: '#f87171' },
          text: { primary: '#e2e8f0', secondary: '#94a3b8' },
          border: { dark: '#1e293b', light: '#1e293b' },
          background: { main: '#0b1120' },
          http: { get: '#38bdf8', post: '#4ade80', put: '#fbbf24', delete: '#f87171' },
          responses: {
            success: { color: '#4ade80', backgroundColor: 'rgba(74,222,128,.12)' },
            error: { color: '#f87171', backgroundColor: 'rgba(248,113,113,.12)' },
            info: { color: '#38bdf8', backgroundColor: 'rgba(56,189,248,.12)' },
            redirect: { color: '#fbbf24', backgroundColor: 'rgba(251,191,36,.12)' },
          },
        },
        typography: {
          fontSize: '15px',
          code: { color: '#e2e8f0', backgroundColor: '#111c33' },
          links: { color: '#38bdf8' },
        },
        sidebar: {
          backgroundColor: '#0f172a',
          textColor: '#cbd5e1',
          activeTextColor: '#38bdf8',
          arrow: { color: '#64748b' },
        },
        rightPanel: { backgroundColor: '#0f172a', textColor: '#cbd5e1' },
      }

      function showMessage(title, text, actionLabel, actionHref) {
        document.getElementById('redoc').classList.add('hidden')
        document.getElementById('message-title').textContent = title
        document.getElementById('message-text').textContent = text
        const action = document.getElementById('message-action')
        action.textContent = actionLabel
        action.href = actionHref
        document.getElementById('message').classList.remove('hidden')
      }

      ;(async function boot() {
        try {
          const response = await fetch('/openapi.json', { credentials: 'same-origin' })
          if (response.status === 401 || response.status === 403) {
            showMessage(
              'Connexion requise',
              'Le schéma de l’API n’est accessible qu’aux personnes connectées à AviaDB. ' +
                'Ouvrez l’application, identifiez-vous, puis revenez sur cette page.',
              'Se connecter',
              '/',
            )
            return
          }
          if (!response.ok) throw new Error('réponse HTTP ' + response.status)

          const spec = await response.json()
          Redoc.init(
            spec,
            {
              theme: dark ? darkTheme : lightTheme,
              hideDownloadButton: false,
              expandResponses: '200,201',
              jsonSampleExpandLevel: 3,
              pathInMiddlePanel: true,
              scrollYOffset: 56,
            },
            document.getElementById('redoc'),
          )
        } catch (error) {
          showMessage(
            'Documentation indisponible',
            `Le schéma OpenAPI n’a pas pu être chargé (${error.message}). ` +
              'Vérifiez que le serveur est démarré, puis rechargez la page.',
            'Réessayer',
            '/api-docs/',
          )
        }
      })()
    </script>
  </body>
</html>
