<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API AviaDB — essais (Swagger UI)</title>
    <script>
      /* Le thème suit celui choisi dans l'application (même clé de stockage). */
      (function () {
        try {
          var stored = localStorage.getItem('aviadb-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="swagger-ui.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">
        <span class="logo">A</span>
        <span>
          API AviaDB
          <span class="sub">— documentation et essais (Swagger UI)</span>
        </span>
      </span>
      <nav>
        <a class="link" href="/">← Retour à l’application</a>
        <a class="link" href="/openapi.json" download="aviadb-openapi.json">Télécharger le schéma</a>
      </nav>
    </header>

    <p class="panel-note">
      « Try it out » exécute réellement les requêtes depuis ce navigateur : la session
      en cours est utilisée, inutile de saisir un jeton.
    </p>

    <main id="swagger" class="panel"></main>

    <section id="message" class="hidden">
      <h1 id="message-title">Documentation indisponible</h1>
      <p id="message-text"></p>
      <a id="message-action" href="/">Ouvrir l’application</a>
    </section>

    <script src="swagger-ui-bundle.js"></script>
    <script>
      function showMessage(title, text, actionLabel, actionHref) {
        const panel = document.getElementById('swagger')
        panel.classList.add('hidden')
        document.querySelector('.panel-note').classList.add('hidden')
        document.getElementById('message-title').textContent = title
        document.getElementById('message-text').textContent = text
        const action = document.getElementById('message-action')
        action.textContent = actionLabel
        action.href = actionHref
        document.getElementById('message').classList.remove('hidden')
      }

      ;(async function boot() {
        try {
          const response = await fetch('/openapi.json', { credentials: 'same-origin' })
          if (response.status === 401 || response.status === 403) {
            showMessage(
              'Connexion requise',
              'Le schéma de l’API n’est accessible qu’aux personnes connectées à AviaDB. ' +
                'Ouvrez l’application, identifiez-vous, puis revenez sur cette page.',
              'Se connecter',
              '/',
            )
            return
          }
          if (!response.ok) throw new Error('réponse HTTP ' + response.status)

          const spec = await response.json()
          window.ui = SwaggerUIBundle({
            spec,
            dom_id: '#swagger',
            layout: 'BaseLayout',
            presets: [SwaggerUIBundle.presets.apis],
            deepLinking: true,
            // Les requêtes « Try it out » emportent le cookie de session.
            withCredentials: true,
            tryItOutEnabled: true,
            displayRequestDuration: true,
            persistAuthorization: true,
            filter: true,
            docExpansion: 'list',
            defaultModelsExpandDepth: 1,
            syntaxHighlight: { activated: true, theme: 'agate' },
          })
        } catch (error) {
          showMessage(
            'Documentation indisponible',
            `Le schéma OpenAPI n’a pas pu être chargé (${error.message}). ` +
              'Vérifiez que le serveur est démarré, puis rechargez la page.',
            'Réessayer',
            '/api-docs/',
          )
        }
      })()
    </script>
  </body>
</html>
