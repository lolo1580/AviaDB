# En-têtes de sécurité, inclus par le serveur et par chaque `location` qui
# définit ses propres `add_header` (nginx n'hérite alors plus ceux du serveur).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# `unsafe-inline` reste nécessaire (styles de Vue, scripts des pages de
# documentation) : la directive bloque malgré tout tout script distant.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
